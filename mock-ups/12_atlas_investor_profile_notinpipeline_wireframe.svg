  <text x="272" y="508" font-size="15" font-weight="600" fill="#1F1E1C">Portfolio</text>
  <text x="272" y="530" font-size="13" fill="#6B6A64">Includes: Whoop, Statsbomb, Trainingpeaks, Formsense, Ridewell.</text>
  <text x="272" y="548" font-size="12" fill="#9B9A93">Relevant sports-tech investments: Whoop (wearables), Statsbomb (analytics).</text>

