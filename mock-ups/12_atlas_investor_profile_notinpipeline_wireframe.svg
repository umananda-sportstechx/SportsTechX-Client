  <rect x="252" y="200" width="1116" height="84" rx="12" fill="#FFFFFF" stroke="#E4E2DB"/>
  <text x="272" y="224" font-size="15" font-weight="600" fill="#1F1E1C">Overview</text>
  <text x="272" y="246" font-size="13" fill="#6B6A64">Baseline Ventures is a European seed-stage fund investing in connected hardware and</text>
  <text x="272" y="264" font-size="13" fill="#6B6A64">data-driven consumer products. Typically leads rounds and takes a board seat.</text>

  <rect x="252" y="300" width="1116" height="84" rx="12" fill="#FFFFFF" stroke="#E4E2DB"/>
  <text x="272" y="324" font-size="15" font-weight="600" fill="#1F1E1C">Investment thesis</text>
  <text x="272" y="346" font-size="13" fill="#6B6A64">Backs founders building recurring-revenue products at the intersection of hardware and</text>
  <text x="272" y="364" font-size="13" fill="#6B6A64">software, with early distribution or design partners already in place.</text>

  <rect x="252" y="400" width="1116" height="68" rx="12" fill="#FFFFFF" stroke="#E4E2DB"/>
