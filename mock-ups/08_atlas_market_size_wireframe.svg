<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="760" fill="#FFFFFF"/>

  <!-- NAV -->
  <rect x="0" y="0" width="220" height="760" fill="#F7F6F2"/>
  <line x1="220" y1="0" x2="220" y2="760" stroke="#E4E2DB" stroke-width="1"/>
  <text x="28" y="48" font-size="16" font-weight="600" fill="#1F1E1C">Atlas</text>

  <text x="40" y="106" font-size="14" fill="#6B6A64">Home</text>
  <text x="40" y="152" font-size="14" fill="#6B6A64">Pitch deck</text>
  <rect x="16" y="176" width="188" height="34" rx="8" fill="#EAF2FA"/>
  <text x="40" y="198" font-size="14" fill="#1B4C78">Market</text>
  <text x="40" y="244" font-size="14" fill="#6B6A64">Investors</text>
  <text x="40" y="290" font-size="14" fill="#6B6A64">Pipeline</text>
  <text x="40" y="336" font-size="14" fill="#6B6A64">Resources</text>

  <line x1="16" y1="680" x2="204" y2="680" stroke="#E4E2DB" stroke-width="1"/>
  <text x="40" y="712" font-size="14" fill="#6B6A64">Raise settings</text>
  <text x="40" y="748" font-size="14" fill="#6B6A64">Account</text>

  <!-- HEADER -->
  <text x="252" y="40" font-size="22" font-weight="600" fill="#1F1E1C">Market</text>

  <!-- KPI ROW -->
  <rect x="252" y="64" width="212" height="64" rx="8" fill="#F2F1EC"/>
  <text x="268" y="88" font-size="12" fill="#6B6A64">Total market (TAM)</text>
  <text x="268" y="112" font-size="18" font-weight="600" fill="#1F1E1C">EUR 12.4bn</text>

  <rect x="477" y="64" width="212" height="64" rx="8" fill="#F2F1EC"/>
  <text x="493" y="88" font-size="12" fill="#6B6A64">Addressable market (SAM)</text>
  <text x="493" y="112" font-size="18" font-weight="600" fill="#1F1E1C">EUR 2.1bn</text>

  <rect x="702" y="64" width="212" height="64" rx="8" fill="#F2F1EC"/>
  <text x="718" y="88" font-size="12" fill="#6B6A64">Market growth</text>
  <text x="718" y="112" font-size="18" font-weight="600" fill="#1F1E1C">18% CAGR</text>

  <rect x="927" y="64" width="212" height="64" rx="8" fill="#F2F1EC"/>
  <text x="943" y="88" font-size="12" fill="#6B6A64">Competitors tracked</text>
  <text x="943" y="112" font-size="18" font-weight="600" fill="#1F1E1C">22</text>

  <rect x="1152" y="64" width="212" height="64" rx="8" fill="#F2F1EC"/>
  <text x="1168" y="88" font-size="12" fill="#6B6A64">Total funding raised</text>
  <text x="1168" y="112" font-size="18" font-weight="600" fill="#1F1E1C">EUR 640m</text>

  <!-- TABS -->
  <text x="252" y="164" font-size="14" font-weight="600" fill="#1F1E1C">Market size</text>
  <line x1="252" y1="174" x2="342" y2="174" stroke="#1F1E1C" stroke-width="2"/>
  <text x="366" y="164" font-size="14" fill="#6B6A64">Competitors</text>
  <line x1="252" y1="190" x2="1368" y2="190" stroke="#E4E2DB" stroke-width="1"/>

  <!-- CLASSIFICATION CARD -->
  <rect x="252" y="206" width="1116" height="64" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="276" y="228" font-size="13" fill="#6B6A64">Your market classification</text>
  <text x="276" y="252" font-size="15" font-weight="600" fill="#1F1E1C">Athletes</text>
  <text x="342" y="252" font-size="15" fill="#9B9A93">-&gt;</text>
  <text x="366" y="252" font-size="15" font-weight="600" fill="#1F1E1C">Activity software</text>
  <text x="522" y="252" font-size="15" fill="#9B9A93">-&gt;</text>
  <text x="546" y="252" font-size="15" font-weight="600" fill="#1F1E1C">Tracking and analytics</text>
  <circle cx="732" cy="247" r="8" fill="none" stroke="#9B9A93"/>
  <text x="729" y="251" font-size="11" fill="#6B6A64">i</text>

  <!-- MARKET SIZE BAR CARD -->
  <rect x="252" y="286" width="1116" height="150" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="276" y="312" font-size="15" font-weight="600" fill="#1F1E1C">Market size</text>
  <text x="276" y="336" font-size="12" fill="#6B6A64">Addressable market (SAM)</text>
  <text x="1344" y="336" font-size="12" fill="#6B6A64" text-anchor="end">Total market (TAM)</text>
  <rect x="276" y="346" width="1068" height="14" rx="7" fill="#F2F1EC"/>
  <rect x="276" y="346" width="182" height="14" rx="7" fill="#378ADD"/>
  <text x="276" y="384" font-size="20" font-weight="600" fill="#1F1E1C">EUR 2.1bn</text>
  <text x="1344" y="384" font-size="20" font-weight="600" fill="#1F1E1C" text-anchor="end">EUR 12.4bn</text>
  <text x="276" y="410" font-size="13" fill="#6B6A64">Your addressable market is 17% of the total market, based on your current geography</text>
  <text x="276" y="426" font-size="13" fill="#6B6A64">and segment classification.</text>

  <!-- MARKET INSIGHTS CARD -->
  <rect x="252" y="452" width="1116" height="116" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="276" y="478" font-size="15" font-weight="600" fill="#1F1E1C">Market insights</text>
  <text x="276" y="500" font-size="13" fill="#6B6A64">The athlete tracking and analytics market is a high-growth segment, driven by increasing</text>
  <text x="276" y="518" font-size="13" fill="#6B6A64">adoption across professional and amateur sports. Investment activity remains strong, with</text>
  <text x="276" y="536" font-size="13" fill="#6B6A64">growing demand for data-driven performance solutions.</text>

  <!-- FOUNDER ACTIONS -->
  <rect x="252" y="584" width="150" height="34" rx="6" fill="none" stroke="#B4B2A9"/>
  <text x="270" y="606" font-size="13" fill="#1F1E1C">Change geography</text>
  <rect x="414" y="584" width="200" height="34" rx="6" fill="none" stroke="#B4B2A9"/>
  <text x="432" y="606" font-size="13" fill="#1F1E1C">Select a narrower segment</text>
  <rect x="626" y="584" width="170" height="34" rx="6" fill="none" stroke="#B4B2A9"/>
  <text x="644" y="606" font-size="13" fill="#1F1E1C">Correct categorisation</text>
</svg>
