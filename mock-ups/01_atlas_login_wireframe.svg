<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="680" fill="#FFFFFF"/>
  <rect x="200" y="60" width="400" height="560" rx="12" fill="#FFFFFF" stroke="#E4E2DB"/>

  <text x="400" y="104" font-size="16" font-weight="600" fill="#1F1E1C" text-anchor="middle">Atlas</text>
  <text x="400" y="144" font-size="18" font-weight="600" fill="#1F1E1C" text-anchor="middle">Log in to your account</text>
  <text x="400" y="166" font-size="13" fill="#6B6A64" text-anchor="middle">Welcome back. Enter your details to continue.</text>

  <rect x="232" y="190" width="336" height="38" rx="6" fill="none" stroke="#DAD8D0"/>
  <rect x="252" y="200" width="16" height="16" rx="3" fill="#E4E2DB"/>
  <text x="400" y="213" font-size="13" fill="#1F1E1C" text-anchor="middle">Continue with Google</text>

  <rect x="232" y="236" width="336" height="38" rx="6" fill="none" stroke="#DAD8D0"/>
  <rect x="252" y="246" width="16" height="16" rx="3" fill="#E4E2DB"/>
  <text x="400" y="259" font-size="13" fill="#1F1E1C" text-anchor="middle">Continue with LinkedIn</text>

  <rect x="232" y="282" width="336" height="38" rx="6" fill="none" stroke="#DAD8D0"/>
  <rect x="252" y="292" width="16" height="16" rx="3" fill="#E4E2DB"/>
  <text x="400" y="305" font-size="13" fill="#1F1E1C" text-anchor="middle">Continue with Microsoft</text>

  <line x1="232" y1="344" x2="378" y2="344" stroke="#E4E2DB"/>
  <text x="400" y="348" font-size="12" fill="#9B9A93" text-anchor="middle">or</text>
  <line x1="422" y1="344" x2="568" y2="344" stroke="#E4E2DB"/>

  <text x="232" y="372" font-size="13" fill="#6B6A64">Email</text>
  <rect x="232" y="380" width="336" height="36" rx="6" fill="none" stroke="#DAD8D0"/>
  <text x="244" y="402" font-size="13" fill="#9B9A93">name@company.com</text>

  <text x="232" y="436" font-size="13" fill="#6B6A64">Password</text>
  <text x="568" y="436" font-size="12" fill="#1B4C78" text-anchor="end">Forgot password?</text>
  <rect x="232" y="448" width="336" height="36" rx="6" fill="none" stroke="#DAD8D0"/>
  <text x="244" y="470" font-size="13" fill="#9B9A93">Enter your password</text>

  <rect x="232" y="500" width="336" height="40" rx="6" fill="#1F1E1C"/>
  <text x="400" y="524" font-size="14" fill="#FFFFFF" text-anchor="middle">Log in</text>

  <text x="400" y="566" font-size="13" fill="#6B6A64" text-anchor="middle">Don't have an account? <tspan fill="#1B4C78">Sign up</tspan></text>
</svg>
