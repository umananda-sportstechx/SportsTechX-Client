  <rect x="977" y="508" width="371" height="34" rx="6" fill="#1F1E1C"/>
  <text x="1120" y="530" font-size="13" fill="#FFFFFF">Book your call</text>

  <text x="977" y="580" font-size="11" fill="#9B9A93">Locked</text>
  <text x="1030" y="580" font-size="11" fill="#9B9A93">/</text>
  <rect x="1042" y="568" width="74" height="20" rx="6" fill="#EAF2FA"/>
  <text x="1050" y="582" font-size="11" font-weight="600" fill="#1B4C78">Unlocked</text>
  <text x="1122" y="580" font-size="11" fill="#9B9A93">/</text>
  <text x="1134" y="580" font-size="11" fill="#9B9A93">Booked</text>
  <text x="1186" y="580" font-size="11" fill="#9B9A93">/</text>
