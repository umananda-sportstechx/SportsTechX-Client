  <text x="276" y="330" font-size="13" font-weight="600" fill="#1F1E1C">Top priority improvements</text>
  <text x="276" y="354" font-size="13" fill="#6B6A64">1. Break out hardware gross margin per unit separately from software revenue.</text>
  <text x="276" y="376" font-size="13" fill="#6B6A64">2. Show retention cohorts across a larger, statistically meaningful set of clubs.</text>
  <text x="276" y="398" font-size="13" fill="#6B6A64">3. Justify the pre-money valuation with comparable unit economics.</text>

