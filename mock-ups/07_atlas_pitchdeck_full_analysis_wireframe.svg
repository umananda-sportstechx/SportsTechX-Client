  <text x="252" y="64" font-size="20" font-weight="600" fill="#1F1E1C">v3  Zenniz - Seed deck.pdf</text>
  <text x="252" y="86" font-size="14" fill="#6B6A64">Analysed 23 May 2026</text>
  <rect x="1178" y="44" width="190" height="34" rx="6" fill="none" stroke="#DAD8D0"/>
  <text x="1273" y="65" font-size="13" fill="#1F1E1C" text-anchor="middle">Analyse revised deck</text>

  <rect x="252" y="110" width="1116" height="150" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
  <circle cx="316" cy="182" r="34" stroke="#EF9F27" stroke-width="5" fill="none"/>
  <text x="316" y="188" font-size="17" font-weight="600" fill="#1F1E1C" text-anchor="middle">67</text>
  <rect x="271" y="222" width="90" height="20" rx="6" fill="#FAEEDA"/>
  <text x="316" y="236" font-size="11" fill="#854F0B" text-anchor="middle">Developing</text>

  <text x="384" y="150" font-size="13" fill="#6B6A64">An investor would likely take the meeting - real revenue and 100% club retention are</text>
  <text x="384" y="168" font-size="13" fill="#6B6A64">meaningful signals. The pre-money valuation is hard to underwrite without hardware gross</text>
  <text x="384" y="186" font-size="13" fill="#6B6A64">margins and per-club SaaS contribution shown clearly. Prove the path from hardware-heavy</text>
  <text x="384" y="204" font-size="13" fill="#6B6A64">to software-dominant economics next.</text>

  <text x="252" y="298" font-size="13" font-weight="600" fill="#1F1E1C">Scores by topic</text>

  <rect x="252" y="312" width="356" height="140" rx="12" fill="#F1EFE8"/>
  <text x="272" y="336" font-size="12" font-weight="600" fill="#1F1E1C">Story</text>
  <text x="272" y="360" font-size="13" fill="#6B6A64">Problem</text><text x="588" y="360" font-size="13" fill="#1F1E1C" text-anchor="end">7.0</text>
  <text x="272" y="382" font-size="13" fill="#6B6A64">Solution</text><text x="588" y="382" font-size="13" fill="#1F1E1C" text-anchor="end">6.5</text>
  <text x="272" y="404" font-size="13" fill="#6B6A64">Market</text><text x="588" y="404" font-size="13" fill="#1F1E1C" text-anchor="end">7.5</text>
  <text x="272" y="426" font-size="13" fill="#6B6A64">Product</text><text x="588" y="426" font-size="13" fill="#1F1E1C" text-anchor="end">6.0</text>

  <rect x="632" y="312" width="356" height="140" rx="12" fill="#F1EFE8"/>
  <text x="652" y="336" font-size="12" font-weight="600" fill="#1F1E1C">Business and traction</text>
  <text x="652" y="360" font-size="13" fill="#6B6A64">Business model</text><text x="968" y="360" font-size="13" fill="#1F1E1C" text-anchor="end">5.5</text>
  <text x="652" y="382" font-size="13" fill="#6B6A64">Competition</text><text x="968" y="382" font-size="13" fill="#1F1E1C" text-anchor="end">6.0</text>
  <text x="652" y="404" font-size="13" fill="#6B6A64">Go-to-market</text><text x="968" y="404" font-size="13" fill="#1F1E1C" text-anchor="end">6.5</text>
  <text x="652" y="426" font-size="13" fill="#6B6A64">Traction</text><text x="968" y="426" font-size="13" fill="#1F1E1C" text-anchor="end">7.0</text>

  <rect x="1012" y="312" width="356" height="140" rx="12" fill="#F1EFE8"/>
  <text x="1032" y="336" font-size="12" font-weight="600" fill="#1F1E1C">Numbers and team</text>
  <text x="1032" y="360" font-size="13" fill="#6B6A64">Financials</text><text x="1348" y="360" font-size="13" fill="#1F1E1C" text-anchor="end">5.0</text>
  <text x="1032" y="382" font-size="13" fill="#6B6A64">Team</text><text x="1348" y="382" font-size="13" fill="#1F1E1C" text-anchor="end">8.0</text>
  <text x="1032" y="404" font-size="13" fill="#6B6A64">The ask</text><text x="1348" y="404" font-size="13" fill="#1F1E1C" text-anchor="end">5.5</text>

  <text x="252" y="478" font-size="13" font-weight="600" fill="#1F1E1C">Area-by-area detail</text>
  <rect x="252" y="492" width="1116" height="690" rx="12" fill="#F1EFE8"/>

  <text x="276" y="522" font-size="14" font-weight="600" fill="#1F1E1C">Problem <tspan fill="#9B9A93" font-weight="400">7.0/10</tspan></text>
  <text x="1332" y="522" font-size="16" fill="#9B9A93" text-anchor="end">-</text>
  <polyline points="273,540 277,544 284,535" fill="none" stroke="#3B6D11" stroke-width="2"/>
  <text x="292" y="546" font-size="13" fill="#1F1E1C">What the deck shows: <tspan fill="#6B6A64">tennis courts are largely undigitized, with no electronic line</tspan></text>
  <text x="292" y="564" font-size="13" fill="#6B6A64">calls, real-time analytics or integrated coaching at the club level.</text>
  <line x1="316" y1="574" x2="323" y2="581" stroke="#A32D2D" stroke-width="2"/>
  <line x1="316" y1="581" x2="323" y2="574" stroke="#A32D2D" stroke-width="2"/>
  <text x="292" y="582" font-size="13" fill="#1F1E1C" transform="translate(0,0)"></text>
  <text x="332" y="582" font-size="13" fill="#1F1E1C">Missing / unproven: <tspan fill="#6B6A64">no voice-of-customer data or quantified cost of the problem.</tspan></text>
  <line x1="252" y1="602" x2="1368" y2="602" stroke="#DAD8D0"/>

  <text x="276" y="632" font-size="14" font-weight="600" fill="#1F1E1C">Traction <tspan fill="#9B9A93" font-weight="400">7.0/10</tspan></text>
  <text x="1332" y="632" font-size="16" fill="#9B9A93" text-anchor="end">-</text>
  <polyline points="273,650 277,654 284,645" fill="none" stroke="#3B6D11" stroke-width="2"/>
  <text x="292" y="656" font-size="13" fill="#1F1E1C">What the deck shows: <tspan fill="#6B6A64">$1.2M+ booked revenue YTD, $4.6M active pipeline, 100% club</tspan></text>
  <text x="292" y="674" font-size="13" fill="#6B6A64">retention, 25+ countries.</text>
  <line x1="316" y1="684" x2="323" y2="691" stroke="#A32D2D" stroke-width="2"/>
  <line x1="316" y1="691" x2="323" y2="684" stroke="#A32D2D" stroke-width="2"/>
  <text x="332" y="692" font-size="13" fill="#1F1E1C">Missing / unproven: <tspan fill="#6B6A64">no cohort curves or MRR figure behind the retention claim.</tspan></text>
  <line x1="252" y1="712" x2="1368" y2="712" stroke="#DAD8D0"/>

  <text x="276" y="742" font-size="13" fill="#6B6A64">Solution</text><text x="1332" y="742" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="756" x2="1368" y2="756" stroke="#DAD8D0"/>
  <text x="276" y="782" font-size="13" fill="#6B6A64">Market</text><text x="1332" y="782" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="796" x2="1368" y2="796" stroke="#DAD8D0"/>
  <text x="276" y="822" font-size="13" fill="#6B6A64">Product</text><text x="1332" y="822" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
