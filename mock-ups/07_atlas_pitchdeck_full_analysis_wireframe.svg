  <text x="276" y="862" font-size="13" fill="#6B6A64">Business model</text><text x="1332" y="862" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="876" x2="1368" y2="876" stroke="#DAD8D0"/>
  <text x="276" y="902" font-size="13" fill="#6B6A64">Competition</text><text x="1332" y="902" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="916" x2="1368" y2="916" stroke="#DAD8D0"/>
  <text x="276" y="942" font-size="13" fill="#6B6A64">Go-to-market</text><text x="1332" y="942" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="956" x2="1368" y2="956" stroke="#DAD8D0"/>
  <text x="276" y="982" font-size="13" fill="#6B6A64">Financials</text><text x="1332" y="982" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="996" x2="1368" y2="996" stroke="#DAD8D0"/>
  <text x="276" y="1022" font-size="13" fill="#6B6A64">Team</text><text x="1332" y="1022" font-size="15" fill="#9B9A93" text-anchor="end">+</text>
  <line x1="252" y1="1036" x2="1368" y2="1036" stroke="#DAD8D0"/>
  <text x="276" y="1062" font-size="13" fill="#6B6A64">The ask</text><text x="1332" y="1062" font-size="15" fill="#9B9A93" text-anchor="end">+</text>

  <text x="252" y="1218" font-size="13" font-weight="600" fill="#1F1E1C">Specific recommendations</text>
  <text x="252" y="1242" font-size="13" fill="#6B6A64">Break out hardware margin from software revenue.</text>
  <text x="252" y="1262" font-size="13" fill="#6B6A64">Show retention cohorts across more clubs.</text>
  <text x="252" y="1282" font-size="13" fill="#6B6A64">Justify pre-money with comparable unit economics.</text>

  <text x="632" y="1218" font-size="13" font-weight="600" fill="#1F1E1C">Strengths</text>
  <text x="632" y="1242" font-size="13" fill="#6B6A64">Real booked revenue, not just pipeline.</text>
  <text x="632" y="1262" font-size="13" fill="#6B6A64">ITF certification lends third-party credibility.</text>
  <text x="632" y="1282" font-size="13" fill="#6B6A64">Differentiated hardware + software bundle.</text>

  <text x="1012" y="1218" font-size="13" font-weight="600" fill="#1F1E1C">Main investor concerns</text>
  <text x="1012" y="1242" font-size="13" fill="#6B6A64">Hardware gross margin is unproven.</text>
  <text x="1012" y="1262" font-size="13" fill="#6B6A64">Retention claim lacks a clear sample size.</text>
  <text x="1012" y="1282" font-size="13" fill="#6B6A64">Valuation is hard to underwrite from the deck alone.</text>
